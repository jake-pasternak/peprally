name: Peprally
options:
  bundleIdPrefix: app.peprally
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  Peprally:
    type: application
    platform: iOS
    dependencies:
      - package: Supabase
        product: Supabase
    sources:
      - path: Peprally
        excludes:
          - "Resources/ring"
          - "Resources/logo-frames"
      - path: Peprally/Resources/ring
        type: folder
        buildPhase: resources
      - path: Peprally/Resources/logo-frames
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: peprally+
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconGlass
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        PRODUCT_BUNDLE_IDENTIFIER: com.jakepasternak.compoundplus
        MARKETING_VERSION: "5.2"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L7J84MA224
        CODE_SIGN_ENTITLEMENTS: Peprally/Peprally.entitlements

  # A second app that is nothing but the demo: same code, fixtures compiled in
  # via the DEMO flag, so tapping the icon opens the full feed with no env vars
  # and no backend. Separate bundle id, so it installs alongside the real app
  # and can never be confused with it — the display name says "demo" too.
  PeprallyDemo:
    type: application
    platform: iOS
    dependencies:
      - package: Supabase
        product: Supabase
    sources:
      - path: Peprally
        excludes:
          - "Resources/ring"
          - "Resources/logo-frames"
      - path: Peprally/Resources/ring
        type: folder
        buildPhase: resources
      - path: Peprally/Resources/logo-frames
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: peprally
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconGlass
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        PRODUCT_BUNDLE_IDENTIFIER: com.jakepasternak.compoundplus.demo
        MARKETING_VERSION: "5.2"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEMO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L7J84MA224
