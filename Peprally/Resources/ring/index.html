<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring Carousel</title>
<style>
  :root {
    /* ---- tweakables ---- */
    --card-w: 13.5vmin;
    --card-h: 13.5vmin;
    --card-radius: 22.5%;
    --rev: 45s;
    --bg: #eeeeee;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  .stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    perspective: 173vmin;
  }

  /* diagonal lean + tilt, measured from the reference */
  .tilt {
    transform-style: preserve-3d;
    transform: translate(3.3vmin, 0.45vmin) rotateZ(-52deg) rotateX(23deg);
  }

  /* the spin runs entirely on the compositor — no JS per frame */
  .ring {
    position: relative;
    width: var(--card-w);
    height: var(--card-h);
    transform-style: preserve-3d;
    animation: spin var(--rev) linear infinite;
    will-change: transform;
  }
  @keyframes spin {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(360deg); }
  }

  .card {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: var(--card-radius);
    overflow: hidden;
    background: linear-gradient(160deg, #1a1a1a 0%, #101010 45%, #0a0a0a 100%);
    backface-visibility: visible;
  }

  .face img,
  .face canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* the one real video: decoded once, painted onto every tile's canvas */
  #source {
    position: absolute;
    width: 2px;
    height: 2px;
    opacity: 0.01;
    pointer-events: none;
  }
</style>
</head>
<body>

<video id="source" src="media/vid-4x3.mp4" muted loop autoplay playsinline></video>

<div class="stage">
  <div class="tilt">
    <div class="ring" id="ring"></div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const N            = 16;    // tiles around the ring
const SECONDS      = 45;    // one revolution (keep in sync with --rev)
const MIN_OPACITY  = 0.22;  // far-side dimming
const CANVAS_SIZE  = 232;   // tile texture resolution
/* ========================================== */

/* host pages can match their background: index.html?bg=ffffff */
const bgParam = new URLSearchParams(location.search).get('bg');
if (bgParam && /^[0-9a-fA-F]{3,8}$/.test(bgParam)) {
  document.documentElement.style.setProperty('--bg', '#' + bgParam);
}

const ring = document.getElementById('ring');
const source = document.getElementById('source');
const step = 360 / N;

const kick = () => source.play().catch(() => {});
source.addEventListener('canplay', kick);
setInterval(kick, 1500);

const cards = [];
for (let i = 0; i < N; i++) {
  const card = document.createElement('div');
  card.className = 'card';
  const face = document.createElement('div');
  face.className = 'face';
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = CANVAS_SIZE;
  face.appendChild(canvas);
  card.appendChild(face);
  ring.appendChild(card);
  cards.push({ card, ctx: canvas.getContext('2d'), opacity: -1 });
}

let vmin = Math.min(innerWidth, innerHeight) / 100;
function layout() {
  vmin = Math.min(innerWidth, innerHeight) / 100;
  const r = 40 * vmin; // ring radius: 40vmin
  cards.forEach((c, i) => {
    c.card.style.transform = `rotateY(${i * step}deg) translateZ(${r}px)`;
  });
}
layout();
addEventListener('resize', layout);

/* one rAF loop: paint the shared frame onto visible tiles, and nudge
   opacities only when they actually change */
const t0 = performance.now();
let tick = 0;
function frame(t) {
  tick++;
  const deg = (((t - t0) / 1000 / SECONDS) * 360) % 360;

  const ready = source.readyState >= 2;
  // center-square crop of the source (1440x1080 -> 1080x1080)
  const sw = source.videoWidth, sh = source.videoHeight;
  const s = Math.min(sw, sh);
  const sx = (sw - s) / 2, sy = (sh - s) / 2;

  for (let i = 0; i < N; i++) {
    const c = cards[i];
    const depth = Math.cos((i * step + deg) * Math.PI / 180); // 1 front, -1 back
    const o = MIN_OPACITY + (1 - MIN_OPACITY) *
      Math.min(1, Math.max(0, depth / 0.26 + 0.5));
    if (Math.abs(o - c.opacity) > 0.015) {
      c.card.style.opacity = o.toFixed(3);
      c.opacity = o;
    }
    if (ready && s > 0) {
      // near tiles repaint every frame; dim far tiles every 4th
      if (o > 0.5 || tick % 4 === i % 4) {
        c.ctx.drawImage(source, sx, sy, s, s, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
      }
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

</body>
</html>
